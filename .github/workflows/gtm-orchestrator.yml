name: GTM Orchestrator

on:
  pull_request:
    paths:
      - "apps/gtm-orchestrator/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gtm-orchestrator.yml"
  push:
    branches: [main]
    paths:
      - "apps/gtm-orchestrator/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gtm-orchestrator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check apps/gtm-orchestrator/src/index.mjs
