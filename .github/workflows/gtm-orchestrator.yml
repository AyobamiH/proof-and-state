name: GTM Orchestrator

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtm-orchestrator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check apps/gtm-orchestrator/src/index.mjs

  deploy-cloudflare-canary:
    needs: contract-tests
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gtm-production
    env:
      WRANGLER_CONFIG: apps/gtm-orchestrator/wrangler.runtime.jsonc
      DEPLOYMENT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Provision or reuse Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORCHESTRATOR_ADMIN_TOKEN: ${{ secrets.ORCHESTRATOR_ADMIN_TOKEN }}
        run: >-
          node apps/gtm-orchestrator/scripts/provision-cloudflare.mjs
          "$WRANGLER_CONFIG"
          "$RUNNER_TEMP/gtm-secrets.json"
          "$RUNNER_TEMP/cloudflare-runtime.env"
      - name: Apply D1 migrations
        run: |
          set -a
          . "$RUNNER_TEMP/cloudflare-runtime.env"
          set +a
          npx wrangler d1 migrations apply proof-state-gtm \
            --remote \
            --config "$WRANGLER_CONFIG"
      - name: Deploy publishing-disabled canary
        run: |
          set -o pipefail
          set -a
          . "$RUNNER_TEMP/cloudflare-runtime.env"
          set +a
          trap 'rm -f -- "$RUNNER_TEMP/gtm-secrets.json"' EXIT
          npx wrangler deploy \
            --config "$WRANGLER_CONFIG" \
            --secrets-file "$RUNNER_TEMP/gtm-secrets.json" \
            --strict \
            --message "Publishing-disabled canary $DEPLOYMENT_SHA" \
            2>&1 | tee "$RUNNER_TEMP/cloudflare-deploy.log"
      - name: Read active Cloudflare deployment
        id: deployment
        run: |
          set -a
          . "$RUNNER_TEMP/cloudflare-runtime.env"
          set +a
          npx wrangler deployments status \
            --config "$WRANGLER_CONFIG" \
            --json \
            > "$RUNNER_TEMP/cloudflare-deployment-status.json"
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          node apps/gtm-orchestrator/scripts/verify-cloudflare-deployment.mjs active-version "$RUNNER_TEMP/cloudflare-deployment-status.json"
      - name: Read exact active Cloudflare version
        run: |
          set -a
          . "$RUNNER_TEMP/cloudflare-runtime.env"
          set +a
          npx wrangler versions view "${{ steps.deployment.outputs.version_id }}" \
            --config "$WRANGLER_CONFIG" \
            --json \
            > "$RUNNER_TEMP/cloudflare-version.json"
      - name: Verify exact Cloudflare provider state
        run: >-
          node apps/gtm-orchestrator/scripts/verify-cloudflare-deployment.mjs validate
          "$RUNNER_TEMP/cloudflare-deployment-status.json"
          "$RUNNER_TEMP/cloudflare-version.json"
      - name: Verify exact deployment health
        id: health
        run: |
          set -a
          . "$RUNNER_TEMP/cloudflare-runtime.env"
          set +a
          trap 'rm -f -- "$RUNNER_TEMP/cloudflare-runtime.env"' EXIT
          node apps/gtm-orchestrator/scripts/verify-cloudflare-health.mjs "$RUNNER_TEMP/cloudflare-deploy.log"
      - name: Remove ephemeral credential files
        if: ${{ always() }}
        run: |
          rm -f -- "$RUNNER_TEMP/gtm-secrets.json"
          rm -f -- "$RUNNER_TEMP/cloudflare-runtime.env"
